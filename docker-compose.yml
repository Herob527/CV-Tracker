
services:
  web:
    working_dir: /app
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "4321:4321"
    depends_on:
      db:
        condition: service_healthy
      init_db:
        condition: service_completed_successfully
    develop:
      watch:
        - path: ./src
          action: sync
          target: /app/src
        - path: ./package.json
          action: rebuild
        - path: ./package-lock.json
          action: rebuild
        - path: ./astro.config.mjs
          action: rebuild
          target: /app/astro.config.mjs

  db:
    image: postgres:18.6-bookworm
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - pgdata:/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    command:
      - postgres
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  adminer:
    image: adminer:5.3.0
    restart: always
    ports:
      - 5433:8080
    depends_on:
      db:
        condition: service_healthy

  init_db:
    env_file: ./.env
    build:
      context: .
      dockerfile: Dockerfile.drizzle
      target: apply
    depends_on:
      db:
        condition: service_healthy
      

volumes:
  pgdata:
    driver: local
